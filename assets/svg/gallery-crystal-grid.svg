  <g stroke="#D4AF37" stroke-width="1.2" opacity="0.55">
    <polygon points="300,100 473,200 473,400 300,500 127,400 127,200" fill="none"/>
    <polygon points="300,160 421,230 421,370 300,440 179,370 179,230" fill="none"/>
    <line x1="300" y1="100" x2="300" y2="500"/>
    <line x1="127" y1="200" x2="473" y2="400"/>
    <line x1="127" y1="400" x2="473" y2="200"/>
  </g>
  <!-- Center Crystal Master Stone -->
