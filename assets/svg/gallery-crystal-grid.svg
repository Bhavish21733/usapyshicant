  <circle cx="300" cy="160" r="16" fill="#202A40" stroke="#D946EF" stroke-width="1.5"/>
  <circle cx="421" cy="230" r="16" fill="#202A40" stroke="#4F46E5" stroke-width="1.5"/>
  <circle cx="421" cy="370" r="16" fill="#202A40" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="300" cy="440" r="16" fill="#202A40" stroke="#10B981" stroke-width="1.5"/>
  <circle cx="179" cy="370" r="16" fill="#202A40" stroke="#EAB308" stroke-width="1.5"/>
  <circle cx="179" cy="230" r="16" fill="#202A40" stroke="#EF4444" stroke-width="1.5"/>
</svg>