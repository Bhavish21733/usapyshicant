<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" fill="#121622"/>
  <circle cx="300" cy="300" r="240" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
  <!-- Velvet cloth diamond -->
  <polygon points="300,90 510,300 300,510 90,300" fill="#171F2D" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
  <!-- Celtic Cross Card Layout -->
  <!-- Card 1 -->
  <rect x="255" y="225" width="90" height="150" rx="6" fill="#1F293D" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Card 2 (Crossed) -->
  <g transform="translate(300, 300) rotate(90)">
    <rect x="-45" y="-75" width="90" height="150" rx="6" fill="#25324A" stroke="#F3EBDD" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="0" r="20" stroke="#D4AF37" stroke-width="1" fill="none"/>
  </g>
  <!-- Card 3 (Below / Root) -->
  <rect x="255" y="390" width="90" height="110" rx="6" fill="#1A2234" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2 4"/>
  <!-- Card 4 (Left / Past) -->
  <rect x="135" y="245" width="90" height="110" rx="6" fill="#1A2234" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2 4"/>
  <!-- Card 5 (Above / Crown) -->
  <rect x="255" y="100" width="90" height="110" rx="6" fill="#1A2234" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2 4"/>
  <!-- Card 6 (Right / Near Future) -->
  <rect x="375" y="245" width="90" height="110" rx="6" fill="#1A2234" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="2 4"/>
</svg>