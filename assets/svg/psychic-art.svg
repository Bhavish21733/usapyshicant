<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="psychicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="psychicGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EBDD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A7338"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="180" fill="url(#psychicGlow)"/>
  <circle cx="200" cy="200" r="160" stroke="url(#psychicGold)" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>
  <circle cx="200" cy="200" r="120" stroke="url(#psychicGold)" stroke-width="1.5" opacity="0.7"/>
  <!-- Celestial Third Eye -->
  <path d="M80,200 C130,130 270,130 320,200 C270,270 130,270 80,200 Z" stroke="url(#psychicGold)" stroke-width="2" fill="#111622" fill-opacity="0.75"/>
  <circle cx="200" cy="200" r="42" stroke="url(#psychicGold)" stroke-width="1.5" fill="#161B26"/>
  <circle cx="200" cy="200" r="26" fill="url(#psychicGold)"/>
  <circle cx="200" cy="200" r="12" fill="#0A0C10"/>
  <circle cx="194" cy="194" r="4" fill="#FFFFFF"/>
  <!-- Rays radiating from third eye -->
  <g stroke="url(#psychicGold)" stroke-width="1" opacity="0.6">
    <line x1="200" y1="70" x2="200" y2="120"/>
    <line x1="200" y1="280" x2="200" y2="330"/>
    <line x1="110" y1="110" x2="145" y2="145"/>
    <line x1="290" y1="110" x2="255" y2="145"/>
    <line x1="110" y1="290" x2="145" y2="255"/>
    <line x1="290" y1="290" x2="255" y2="255"/>
  </g>
  <!-- Moon phases above -->
  <circle cx="200" cy="55" r="8" fill="#D4AF37"/>
  <circle cx="160" cy="62" r="6" fill="#D4AF37" opacity="0.7"/>
  <circle cx="240" cy="62" r="6" fill="#D4AF37" opacity="0.7"/>
</svg>