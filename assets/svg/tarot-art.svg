<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="100%" stop-color="#0C0E14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EBDD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="10" y="10" width="380" height="540" rx="16" fill="url(#cardBg)" stroke="url(#goldGrad)" stroke-width="2"/>
  <rect x="22" y="22" width="356" height="516" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <!-- Corner Ornaments -->
  <circle cx="32" cy="32" r="5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="368" cy="32" r="5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="32" cy="528" r="5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="368" cy="528" r="5" fill="#D4AF37" opacity="0.7"/>
  <!-- Central Glow -->
  <circle cx="200" cy="240" r="160" fill="url(#starGlow)"/>
  <!-- Central Star of Guidance -->
  <g stroke="url(#goldGrad)" stroke-width="1.8" fill="none">
    <polygon points="200,90 207,175 290,140 225,200 295,255 210,250 200,335 190,250 105,255 175,200 110,140 193,175" fill="url(#goldGrad)" fill-opacity="0.12"/>
    <!-- Concentric Celestial Rings -->
    <circle cx="200" cy="240" r="110" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="200" cy="240" r="80" stroke-width="1.2"/>
    <circle cx="200" cy="240" r="40" stroke-width="1.5" fill="#161B26" fill-opacity="0.8"/>
  </g>
  <!-- Moon Crescent -->
  <path d="M185,215 A28,28 0 0,0 215,265 A32,32 0 1,1 185,215 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Rays and constellations -->
  <g fill="#D4AF37" opacity="0.8">
    <circle cx="140" cy="140" r="2.5"/>
    <circle cx="260" cy="140" r="2.5"/>
    <circle cx="120" cy="290" r="2"/>
    <circle cx="280" cy="290" r="2"/>
    <circle cx="200" cy="370" r="3"/>
  </g>
  <!-- Minor Arch -->
  <path d="M90,440 C140,400 260,400 310,440" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 6" fill="none"/>
  <!-- Card Title -->
  <text x="200" y="480" text-anchor="middle" fill="#F3EBDD" font-family="'Cormorant Garamond', serif" font-size="24" letter-spacing="4">PERSPECTIVE</text>
  <text x="200" y="505" text-anchor="middle" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" letter-spacing="3" opacity="0.8">MAJOR ARCANA · INTUITION</text>
</svg>